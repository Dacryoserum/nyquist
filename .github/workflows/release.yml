name: Release

# Builds the distributable artifacts for a version tag and publishes them as a GitHub
# release.
#
# Published as a **draft**. Neither binary is code-signed, so the Gatekeeper and SmartScreen
# paths described in the release notes below are the first thing a user meets, and they are
# documented rather than verified by any automated step. A draft gives whoever cuts the
# release the chance to open both artifacts on a clean machine before anyone can download
# them — the alternative was artifacts going live the moment the build finished.
#
# The full PR validation suite runs first (see the `validate` job): a release built from a
# commit that would not pass CI is not a release anyone should be handed.
on:
  push:
    tags: ["v*"]
  # Also runnable by hand, so the packaging path can be exercised without minting a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Cheap gate: fail in seconds rather than after two platform builds if the version fields
  # have drifted apart. They must move together in one commit — see the release-packaging
  # skill.
  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Cargo.toml, tauri.conf.json, package.json and the tag agree
        run: |
          CARGO_V=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          TAURI_V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG_V=$(node -p "require('./package.json').version")
          echo "Cargo.toml=$CARGO_V tauri.conf.json=$TAURI_V package.json=$PKG_V"
          if [ "$CARGO_V" != "$TAURI_V" ] || [ "$CARGO_V" != "$PKG_V" ]; then
            echo "::error::Version mismatch between Cargo.toml, tauri.conf.json and package.json"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$CARGO_V" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match project version $CARGO_V"
            exit 1
          fi

  # The same checks a pull request has to pass. Reused rather than restated so the two cannot
  # drift: a release must never be built from a commit CI would have rejected.
  validate:
    name: Validation
    uses: ./.github/workflows/build.yml

  build:
    needs: [version-check, validate]
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should still produce the other's artifact rather than leaving
      # the release with nothing in it.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (universal)
            # A universal binary needs both slices built explicitly; the runner only has its
            # own architecture installed by default, and shipping a single-arch app named as
            # if it were universal is exactly the trap the release-packaging skill warns about.
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            # `--bundles dmg` keeps the release to a single macOS download. Without it
            # Tauri also emits a bare .app archive, which is the same application twice.
            args: --target universal-apple-darwin --bundles dmg
          - os: windows-latest
            label: Windows (x64)
            rust-targets: ""
            # No target override: the runner is already x64. `--bundles nsis` gives one
            # installer .exe; the default would also produce an .msi, which installs the
            # very same application and only makes the download page ambiguous.
            args: --bundles nsis

    steps:
      - uses: actions/checkout@v4

      # Real-time scanning inspects every object file rustc writes, and a cold build writes
      # tens of thousands. Excluding the build directories is the single biggest lever on
      # Windows CI time here; the cold release build measured 13m45 without it.
      - name: Exclude build dirs from Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "rustc.exe" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "cargo.exe" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "link.exe" -ErrorAction SilentlyContinue

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Purpose-built for Rust: caches registry and dependency artifacts but not this
      # workspace's own output, which changes on every commit and made the plain
      # `target/` cache slow to save (1m42 on Windows) for little benefit.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: release

      # tauri-action uploads everything it finds under bundle/, so a stale artifact
      # restored from cache ends up attached to the release. A v0.1.0 built with
      # `--bundles nsis` shipped an .msi from the previous run this way.
      - name: Remove stale bundles
        shell: bash
        run: rm -rf src-tauri/target/*/release/bundle src-tauri/target/release/bundle

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Nyquist ${{ github.ref_name }}
          # Stated on the release itself rather than left for users to discover. Neither
          # platform's binary is code-signed: macOS notarization needs a paid Apple Developer
          # account and Windows needs a purchased code-signing certificate. Both decisions are
          # deliberately still open (see .claude/CONTEXT.md), so until they are made the
          # workarounds have to be documented where people download the files.
          releaseBody: |
            See `CHANGELOG.md` for what changed.

            **These builds are not code-signed.**

            - **macOS** — Gatekeeper will refuse the app on first launch, reporting an
              unidentified developer. Right-click (or Control-click) Nyquist.app and choose
              **Open**, then confirm. Once per install. The `.dmg` is a universal binary and
              runs natively on both Apple Silicon and Intel Macs.
            - **Windows** — SmartScreen will show "Windows protected your PC". Click **More
              info** → **Run anyway**, then the installer runs normally.

            Nothing you analyze leaves your machine — the app does no network I/O.
          # Draft, so the artifacts can be opened on a clean machine before anyone can
          # download them — see the note at the top of this file.
          releaseDraft: true
          prerelease: false

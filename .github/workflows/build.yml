name: CI

# Every check that AGENTS.md requires before a merge, on every push and PR. A red run
# blocks the merge — that is the point of having it, so please don't merge around it.
on:
  push:
    branches: [main]
  pull_request:
  # Callable from release.yml, so a release is gated on exactly the checks a PR must pass
  # rather than on a second, drifting copy of them.
  workflow_call:

# A new push to the same PR makes the previous run irrelevant. Not applied to a
# `workflow_call`: cancelling the caller's validation would cancel the release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Cheaper CI builds: nothing here is shipped to users, and incremental output would only
  # be thrown away between jobs.
  CARGO_INCREMENTAL: 0
  # Build, Clippy and tests share one optimized dev profile. Debug symbols and release
  # LTO are unnecessary for this validation; distributed binaries keep the release profile.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  frontend:
    name: Frontend (svelte-check, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # `svelte-kit sync` (part of `npm run check`) generates the typed route modules that
      # both of these depend on, so check must come before build.
      - run: npm run check
      - run: npm run build

  # Its own job, on the cheapest runner: formatting needs no toolchain beyond rustfmt and no
  # dependency build, so gating the platform matrix on it would only slow the feedback down.
  format:
    name: Formatting (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check

  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is the primary target. Windows is here because the release workflow ships a
        # Windows binary, and a platform nobody builds on is a platform that quietly breaks:
        # this catches path handling, the media server's platform-specific positional reads
        # and CSPRNG, and any dependency that turns out not to be as portable as assumed. The corpus
        # fixtures are committed, so the tests need no ffmpeg on either runner.
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Real-time scanning inspects every object file rustc writes; excluding the build
      # directories is the biggest single lever on Windows CI time. See release.yml.
      - name: Exclude build dirs from Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "rustc.exe" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "cargo.exe" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "link.exe" -ErrorAction SilentlyContinue

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Purpose-built for Rust: caches dependency artifacts but not this workspace's own
      # output, which changes on every commit.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: checks-${{ runner.os }}-${{ runner.arch }}
          # PR-scoped caches cannot be reused by main or release tags. Save only the
          # common main cache instead of spending minutes uploading an isolated copy.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Tauri's build script needs the frontend dist directory to exist, even for a plain
      # `cargo build` that never serves it.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: cargo build
        working-directory: src-tauri
        run: cargo build --locked --workspace

      # A clippy warning on DSP code is frequently a real numeric bug (truncation,
      # precision loss, operator precedence on floats), which is why this is -D warnings
      # and covers tests too.
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # Includes the corpus false-positive/false-negative report. The fixtures are
      # committed, so this needs no ffmpeg on the runner — only regenerating them does.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked --workspace -- --nocapture

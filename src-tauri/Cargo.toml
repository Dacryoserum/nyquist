[workspace]
members = ["cli"]

[package]
name = "nyquist"
version = "0.3.0"
description = "Desktop audio quality analyzer and lossy-to-lossless transcode detector"
authors = ["Nyquist contributors"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nyquist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "protocol-asset": lets the frontend stream a user-picked file directly via the built-in
# asset:// protocol (native <audio> seek/buffering, no loading the whole file into JS
# memory) — see commands.rs `authorize_playback` and tauri.conf.json assetProtocol.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Sole decoder, see AGENTS.md "Décisions actées" — no claxon until a bit-exact FLAC
# integrity feature is actually scoped.
symphonia = { version = "0.6.0", features = ["all"] }
rustfft = "6.4.1"
# LUFS + True Peak in one crate (pure Rust port of libebur128, MIT). Not enabling
# `precision-true-peak`: it trades a real perf hit for a slight precision gain — revisit
# only if true-peak values are ever shown to diverge meaningfully from reference tools.
ebur128 = "0.1.10"
tauri-plugin-dialog = "2.7.2"
base64 = "0.22.1"
# Data parallelism for the analysis passes. Pure Rust, MIT/Apache-2.0, no FFI — so it does
# not affect the licensing decision recorded in AGENTS.md. Used where the work is genuinely
# independent per item (STFT frames, per-channel statistics) and nowhere else: ebur128 in
# particular is a sequential filter chain and must stay on one thread.
rayon = "1.10"

# Distribution profile, applying to every workspace member.
#
# `lto = "thin"` rather than "fat", measured rather than assumed: on this dependency graph
# fat LTO cost 107.6s to build against 75.9s for thin (-30%), for a pipeline runtime that
# was identical inside the run-to-run noise (3.57-3.90s thin vs 3.67-4.33s fat on the same
# 8-minute reference file). Windows CI is the slowest link in the release — 13m45 for a
# cold build — so 30% off the compile for no measurable runtime cost is the right trade.
# Symbols are stripped, which cuts the shipped size substantially.
#
# `panic` is deliberately left at the default `unwind`: `commands::analyze_file` relies on
# `spawn_blocking` catching a panic and turning it into an error message rather than taking
# the whole app down with it. `panic = "abort"` would break that recovery.
[profile.release]
lto = "thin"
codegen-units = 16
strip = true


# Dependencies are optimized even in dev builds; our own crate is not.
#
# The MDCT grid sweep in `mdct_grid.rs` runs 1024 offsets of FFT work, which is the kind of
# code that collapses without optimization: a 5-minute track took 55s to analyze under
# `tauri dev` against a fraction of a second in release. That made the dev app unusable for
# its own purpose and the corpus test take three and a half minutes.
#
# Optimizing only `package."*"` keeps *our* crate unoptimized, so incremental rebuilds stay
# fast and backtraces stay readable — it is the dependencies (rustfft, symphonia, ebur128)
# that do the arithmetic. Costs one slower cold build; changes nothing about release output.
[profile.dev]
# Light optimization on our own crate too. The sweep loop in `mdct_grid.rs` is ours, so
# optimizing only the dependencies took the same 5-minute track from 55s to 21s — better,
# still too slow to use. Level 1 rather than 2 keeps line numbers and locals intact in a
# backtrace, which is the reason to run a dev build at all.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
